<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embedded JSON Catalog - Categories</title>
</head>
<body>
  <div id="app"></div>
  <script id="catalog-data" type="application/json">
  {
    "categories": [
      {
        "id": "science",
        "title": "Science",
        "url": "https://catalog.example.org/categories/science"
      },
      {
        "id": "astronomy",
        "title": "Astronomy",
        "url": "https://catalog.example.org/categories/astronomy"
      }
    ]
  }
  </script>
</body>
</html>
